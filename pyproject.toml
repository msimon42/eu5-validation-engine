[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eu5-mod-engine"
version = "0.1.0"
description = "Local, evidence-scoped EU5 mod analysis and managed repair workbench"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
eu5 = "backend.cli:main"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
