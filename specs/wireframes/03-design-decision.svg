<text x="25" y="875" fill="#b2bfce" font-size="14" font-weight="400" font-family="Arial, Helvetica, sans-serif">Game: not connected</text>
<text x="266" y="48" fill="#1c2c42" font-size="29" font-weight="700" font-family="Arial, Helvetica, sans-serif">Choose a design for the conflict</text>
<text x="266" y="78" fill="#526174" font-size="15" font-weight="400" font-family="Arial, Helvetica, sans-serif">A proposed repair cannot satisfy both exact-value requirements.</text>
