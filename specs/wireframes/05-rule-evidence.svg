<text x="286" y="303" fill="#263244" font-size="20" font-weight="700" font-family="Arial, Helvetica, sans-serif">Documented six-mode sequence</text>
<text x="286" y="346" fill="#263244" font-size="19" font-weight="400" font-family="Arial, Helvetica, sans-serif">INJECT_OR_CREATE → REPLACE_OR_CREATE → TRY_INJECT → TRY_REPLACE → INJECT → REPLACE</text>
<text x="286" y="381" fill="#805500" font-size="16" font-weight="400" font-family="Arial, Helvetica, sans-serif">Bare creation placement and duplicate handling are separate unresolved questions.</text>
